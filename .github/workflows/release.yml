# A `v*` tag builds the frozen app and the installer, signs both through SignPath when the repository
# is configured for it, and leaves a DRAFT GitHub Release with the installer, its checksum file and
# the release notes. Publishing the draft (and the winget PR) stays a human action (phase-4 section 8.3,
# section 8.4; RD-31). A manual run is a rehearsal: it builds and uploads the artifacts, signs nothing and
# creates no release.
#
# Rules:
# - The tag must equal v<__version__>, and the version resource must agree, or the run stops before
#   the build (tools/release.py check-tag).
# - The build environment installs the `dev` extra only: pillow-heif is never bundled (A6), and a step
#   asserts it is not even importable.
# - Steps run in pwsh. A windowed exe does not block the call operator, so the worker check uses
#   Start-Process -Wait; files for the release are written by tools/release.py (UTF-8, LF), never by a
#   redirection; multi-command steps opt into native-command error checking.
# - Signing is optional: the steps run only on a tag push of this repository when the SignPath
#   variables exist (secrets cannot be read in `if:`); a missing token then fails loudly. The signed
#   executables are verified and put back before Inno Setup packs them, and the installer is signed
#   afterwards. The uninstaller stub stays unsigned (only a compile-time SignTool could sign it).
# - The publish job holds `contents: write` alone, verifies the checksums of what it downloaded, and
#   never overwrites a release that is already published.
# - Third-party actions are pinned to a commit SHA, with the release tag in the comment.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per tag; a signing request in flight is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  SIGNING: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'MorphWheel/morphwheel' && vars.SIGNPATH_ORGANIZATION_ID != '' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120 # a signing request may wait for a manual approval
    permissions:
      contents: read
      actions: read # the SignPath connector reads the uploaded artifact
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Version (a tag must be v<__version__>)
        id: version
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if ($env:EVENT -eq 'push') { python tools/release.py check-tag $env:TAG } else { python tools/release.py version }

      - name: Install the dev extra
        run: python -m pip install -e ".[dev]"

      - name: No pillow-heif in the build environment (A6)
        run: python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('pillow_heif') else 0)"

      - name: Translations (every .ts into a .qm, bundled by the spec)
        run: python tools/translations.py release

      - name: PyInstaller
        run: pyinstaller packaging/pyinstaller/morphwheel.spec --noconfirm --distpath packaging/output/dist --workpath packaging/output/build

      - name: Worker check (the A5a smoke test)
        run: |
          $p = Start-Process -FilePath ".\packaging\output\dist\morphwheel\morphwheel.exe" -ArgumentList "--worker-check" -Wait -PassThru -NoNewWindow
          exit $p.ExitCode

      - name: Upload the executables for signing
        if: env.SIGNING == 'true'
        id: upload-exes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-exes
          path: |
            packaging/output/dist/morphwheel/morphwheel.exe
            packaging/output/dist/morphwheel/morphwheel-worker.exe
          if-no-files-found: error
          overwrite: true

      - name: Sign the executables (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_CONFIG_EXES }}
          github-artifact-id: ${{ steps.upload-exes.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: packaging/output/signed-exes

      - name: Use the signed executables
        if: env.SIGNING == 'true'
        run: |
          foreach ($name in "morphwheel.exe", "morphwheel-worker.exe") {
            $signed = "packaging\output\signed-exes\$name"
            if ((Get-AuthenticodeSignature $signed).Status -ne 'Valid') { throw "$name is not validly signed" }
            Copy-Item $signed "packaging\output\dist\morphwheel\$name" -Force
          }

      - name: Inno Setup
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found on this runner" }
          & $iscc packaging\inno\morphwheel.iss

      - name: Installer name and size (T6)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python tools/release.py check-installer packaging/output/installer --version $env:VERSION --max-mb 45

      - name: Upload the installer for signing
        if: env.SIGNING == 'true'
        id: upload-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: packaging/output/installer/*.exe
          if-no-files-found: error
          overwrite: true

      - name: Sign the installer (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_CONFIG_INSTALLER }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: packaging/output/signed-installer

      - name: Use the signed installer
        if: env.SIGNING == 'true'
        run: |
          $signed = Get-ChildItem packaging\output\signed-installer\*.exe
          if ($signed.Count -ne 1) { throw "expected one signed installer, found $($signed.Count)" }
          if ((Get-AuthenticodeSignature $signed.FullName).Status -ne 'Valid') { throw "the installer is not validly signed" }
          Copy-Item $signed.FullName "packaging\output\installer\$($signed.Name)" -Force

      - name: Checksums and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/release.py checksums (Get-ChildItem packaging\output\installer\*.exe).FullName -o packaging\output\installer\SHA256SUMS.txt
          python tools/release.py notes $env:VERSION -o packaging\output\installer\release-notes.md

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: morphwheel-${{ steps.version.outputs.version }}
          path: packaging/output/installer/
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'MorphWheel/morphwheel'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # the draft release and its assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morphwheel-${{ needs.build.outputs.version }}
          path: release

      - name: Verify the checksums of the downloaded files
        run: python tools/release.py verify release/SHA256SUMS.txt

      - name: Draft release (never overwrites a published one)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = "release/morphwheel-${env:VERSION}-setup.exe"
          $existing = gh release list --json tagName,isDraft | ConvertFrom-Json | Where-Object { $_.tagName -eq $env:TAG }
          if ($existing) {
            if ($existing.isDraft -ne $true) { throw "release $env:TAG is already published; nothing is overwritten" }
            gh release upload $env:TAG $installer release/SHA256SUMS.txt --clobber
            gh release edit $env:TAG --notes-file release/release-notes.md
          } else {
            $flags = @("--draft", "--verify-tag", "--title", "Morphwheel $env:VERSION", "--notes-file", "release/release-notes.md")
            if ($env:PRERELEASE -eq 'true') { $flags += @("--prerelease", "--latest=false") }
            gh release create $env:TAG @flags $installer release/SHA256SUMS.txt
          }
