name: Feature request
description: Suggest a new format, an option or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or the problem, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to do it today, or other designs you considered. Could a plugin do it?
